<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page introuvable | KitokoDevWork</title>

    <style media="screen">
      :root {
        --secondary-color: #112e42;
        --bg-color: #f8fafc;
        --main-color: #00abf0;
        --main-hover: #0088bd;
        --text-primary: #0f172a;
        --text-muted: #475569;
        --border-color: rgba(15, 23, 42, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: radial-gradient(circle at top right, rgba(0, 171, 240, 0.12), transparent 36%), var(--bg-color);
        color: var(--text-primary);
        font-family: Poppins, Arial, sans-serif;
      }
      #message {
        width: min(100%, 480px);
        padding: clamp(24px, 6vw, 40px);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 24px 60px rgba(17, 46, 66, 0.12);
      }
      #message h3 {
        margin: 24px 0 8px;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 500;
      }
      #message h2 {
        margin: 0 0 8px;
        color: var(--main-hover);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      #message h1 {
        margin: 0 0 16px;
        color: var(--secondary-color);
        font-size: clamp(24px, 6vw, 32px);
        font-weight: 700;
        line-height: 1.2;
      }
      #message p {
        margin: 16px 0 24px;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.7;
      }
      #message a {
        display: block;
        padding: 14px 18px;
        border-radius: 999px;
        background: var(--main-color);
        box-shadow: 0 10px 24px rgba(0, 171, 240, 0.2);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
        transition: background 180ms ease, transform 180ms ease;
      }
      #message a:hover {
        background: var(--main-hover);
        transform: translateY(-2px);
      }
      @media (max-width: 600px) {
        body { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <main id="message">
      <h2>KITOKODEVWORK</h2>
      <h1>Oups, page introuvable</h1>
      <h2>404</h2>
      <p>La page que vous recherchez n’existe pas ou a été déplacée. Vérifiez l’adresse ou revenez à l’accueil.</p>
      <a href="/">Retour à l’accueil</a>
    </main>
  </body>
</html>
