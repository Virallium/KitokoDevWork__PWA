<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Hors connexion – KitokoDevWork</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #112e42;
            --bg2-color: #ffffff;
            --main-color: #00abf0;
            --main-color-rgb: 0, 171, 240;
            --text-primary: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
            --border-radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* Effet de lueur d'arrière-plan cohérent avec le site */
        body::before {
            content: '';
            position: absolute;
            width: 100vmax;
            height: 100vmax;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(var(--main-color-rgb), 0.12) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            background: var(--bg2-color);
            border: 1px solid var(--border-color);
            padding: 3rem 2.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background: rgba(var(--main-color-rgb), 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.2rem;
            color: var(--main-color);
            border: 1px solid rgba(var(--main-color-rgb), 0.2);
            animation: pulseIcon 2s infinite ease-in-out;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--main-color-rgb, 0.4)); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 5px rgba(var(--main-color-rgb, 0.2)); }
        }

        h1 {
            font-size: clamp(1.4rem, 2.5vw, 1.8rem);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        p {
            line-height: 1.6;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.85rem 2.2rem;
            background: linear-gradient(135deg, var(--main-color) 0%, #0088bd 100%);
            color: #fff;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(var(--main-color-rgb), 0.3);
            transition: all 0.3s ease;
        }

        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(var(--main-color-rgb), 0.5);
        }
    </style>
</head>
<body>
    <main>
        <div class="icon-container" aria-hidden="true">
            📡
        </div>
        <h1>Oups, vous êtes hors connexion</h1>
        <p>Vérifiez votre connexion Internet puis réessayez. Les fonctionnalités de KitokoDevWork seront à nouveau disponibles dès votre retour en ligne.</p>
        <a href="/" onclick="location.reload(); return false;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.73-5.73"/></svg>
            Réessayer
        </a>
    </main>
</body>
</html>
